[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = true

# Keep the netlify.app preview out of Google; the live domain is unaffected.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
